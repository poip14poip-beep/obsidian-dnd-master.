name: CI

on:
  push:
    branches: [main, cloud-api-client]
  pull_request:
    branches: [main, cloud-api-client]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bunx tsc --noEmit
      - run: bun run build
