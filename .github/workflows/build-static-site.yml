name: Build and publish Obsidian static app

on:
  push:
    branches: [cloud-api-client]
    paths-ignore:
      - "CLOUD_SYNC_IMPLEMENTATION_STATUS.md"
      - "static-site/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obsidian-static-site
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build static application for Supabase Edge Function
        env:
          GITHUB_STATIC_SITE: "true"
          VITE_GITHUB_STATIC_SITE: "true"
        run: bun run build
      - name: Prepare static SPA files
        run: |
          set -euo pipefail
          test -s .output/public/_shell.html
          cp .output/public/_shell.html .output/public/index.html
          cp .output/public/_shell.html .output/public/404.html
          touch .output/public/.nojekyll
      - name: Smoke test public app endpoint
        env:
          APP_URL: "https://dbchfgkdrqpjspptoezh.supabase.co/functions/v1/obsidian-app"
        run: |
          set -euo pipefail
          mkdir -p /tmp/obsidian-smoke
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "$APP_URL/" -o /tmp/obsidian-smoke/index.html; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Static app endpoint did not become available"
              exit 1
            fi
            sleep 5
          done
          grep -q "Obsidian Control" /tmp/obsidian-smoke/index.html
          CSS_PATH="$(grep -oE '/functions/v1/obsidian-app/assets/[^"]+\.css' /tmp/obsidian-smoke/index.html | head -n 1)"
          JS_PATH="$(grep -oE '/functions/v1/obsidian-app/assets/[^"]+\.js' /tmp/obsidian-smoke/index.html | head -n 1)"
          test -n "$CSS_PATH"
          test -n "$JS_PATH"
          curl --fail --silent --show-error "https://dbchfgkdrqpjspptoezh.supabase.co$CSS_PATH" -o /tmp/obsidian-smoke/app.css
          curl --fail --silent --show-error "https://dbchfgkdrqpjspptoezh.supabase.co$JS_PATH" -o /tmp/obsidian-smoke/app.js
          test -s /tmp/obsidian-smoke/app.css
          test -s /tmp/obsidian-smoke/app.js
          curl --fail --silent --show-error "$APP_URL/auth" -o /tmp/obsidian-smoke/auth.html
          grep -q "Obsidian Control" /tmp/obsidian-smoke/auth.html
          echo "Static app, CSS, JS, and SPA auth route are reachable."
      - name: Publish static files to dedicated branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/obsidian-static-site
          cp -R .output/public/. /tmp/obsidian-static-site/
          cd /tmp/obsidian-static-site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Static app build from ${SOURCE_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:static-site
