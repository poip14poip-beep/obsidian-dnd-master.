name: Deploy Obsidian app to GitHub Pages

on:
  push:
    branches:
      - cloud-api-client
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: obsidian-github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build app for GitHub Pages
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: "https://dbchfgkdrqpjspptoezh.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_DSbvWZk4wHJ3CAcXeqwuUA_9F-FzB7J"
          VITE_GITHUB_PAGES: "true"
        run: bun run build
      - name: Prepare SPA fallback
        run: |
          set -euo pipefail
          test -s .output/public/_shell.html
          cp .output/public/_shell.html .output/public/index.html
          cp .output/public/_shell.html .output/public/404.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .output/public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
